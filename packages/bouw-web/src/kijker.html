<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-kijker bouw</title>
<style>
:root { --achtergrond: #eceeef; --vlak: #fbfbfa; --inkt: #22262a; --zacht: #5f676d; --lijn: #d2d7da; --accent: #34505f; --op-accent: #ffffff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--achtergrond); color: var(--inkt); display: flex; flex-direction: column; }
[hidden] { display: none !important; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; background: var(--vlak); border-bottom: 1px solid var(--lijn); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .klein { color: var(--zacht); font-size: 13px; }
.balk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 14px; background: var(--vlak); border-bottom: 1px solid var(--lijn); }
.balk label { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
select, button { font: inherit; min-height: 44px; padding: 8px 12px; border: 1px solid var(--lijn); border-radius: 6px; background: #fff; color: var(--inkt); }
button { cursor: pointer; }
button.hoofd { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }
input[type=checkbox] { width: 22px; height: 22px; }
main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px; gap: 8px; }
/* De 3D tekent op 62 % van haar breedte; kijker.ts kiest de breedte zo dat het beeld in het venster past (niet uitgerekt). */
.drie-d { flex: none; align-self: center; width: 100%; max-width: 100%; border-radius: 6px; overflow: hidden; background: #f2f1ed; }
.drie-d canvas { display: block; width: 100% !important; height: auto !important; cursor: grab; }
.drie-d canvas:active { cursor: grabbing; }
#uitleg { color: var(--zacht); font-size: 13px; margin: 0; }
#leeg { margin: auto; max-width: 520px; text-align: center; padding: 24px; border: 2px dashed var(--lijn); border-radius: 10px; background: var(--vlak); }
#leeg.sleep { border-color: var(--accent); }
#fout { background: #fdecea; color: #8a1f17; border: 1px solid #f0b4ae; border-radius: 6px; padding: 10px 12px; margin: 0; }
header .kop { display: grid; gap: 2px; flex: 1 1 260px; min-width: 0; }
header .aannemer { font-weight: 600; font-size: 14px; color: var(--accent); }
.varianten { align-items: stretch; }
.varianten .klein { color: var(--zacht); font-size: 13px; align-self: center; }
.variantknop { display: grid; gap: 2px; text-align: left; max-width: 340px; padding: 8px 12px; }
.variantknop strong { font-weight: 600; }
.variantknop span { font-size: 12.5px; color: var(--zacht); line-height: 1.3; }
.variantknop[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
#voorbehoud { color: var(--zacht); font-size: 12px; margin: 0; }
/* Bestand voor de klant: alleen kijken, geen ander pakket openen. */
body.klantbestand #ander, body.klantbestand #leeg { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="kop">
    <h1 id="titel">3D-kijker</h1>
    <span id="ondertitel" class="klein"></span>
  </div>
  <span id="aannemer" class="aannemer" hidden></span>
</header>
<div class="balk varianten" id="varianten" hidden>
  <span class="klein">Kies een variant</span>
  <div id="variantknoppen" role="group" aria-label="Variant" style="display:flex;flex-wrap:wrap;gap:8px"></div>
</div>
<div class="balk" id="balk" hidden>
  <label>Toon <select id="keuze" aria-label="Wat tonen"></select></label>
  <label id="niveau-wrap">Tot en met <select id="niveau" aria-label="Tot en met verdieping"></select></label>
  <label id="laag-wrap"><input type="checkbox" id="laag"> Muren laag</label>
  <label id="maten-wrap"><input type="checkbox" id="maten"> Maten</label>
  <button type="button" data-standpunt="schuin">Schuin</button>
  <button type="button" data-standpunt="voor">Voor</button>
  <button type="button" data-standpunt="boven">Boven</button>
  <button type="button" id="bewaar">Bewaar beeld</button>
  <button type="button" id="ander">Ander pakket</button>
</div>
<main>
  <p id="fout" role="alert" hidden></p>
  <div id="leeg">
    <p><strong>Nog geen 3D-pakket.</strong></p>
    <p>Sleep hier een 3D-pakket uit de bouwconfigurator (Overzicht &gt; "3D doorsturen"), of kies het bestand.</p>
    <p><button type="button" class="hoofd" id="kies">Kies een 3D-pakket</button><input type="file" id="bestand" accept=".json,application/json" hidden></p>
  </div>
  <div class="drie-d" id="drie-d" hidden></div>
  <p id="uitleg" hidden></p>
  <p id="voorbehoud" hidden>Een ontwerp ter illustratie: kleuren en materialen zijn een benadering, maten onder voorbehoud van inmeting.</p>
</main>
<!--PAKKET-->
<script>/*BUNDEL*/</script>
</body>
</html>
