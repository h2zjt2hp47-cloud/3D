<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgica</title>
<style>
:root {
  --achter: #1c1a16;
  --balk: #26231d;
  --paneel: rgba(34, 31, 26, 0.94);
  --rand: #4a4335;
  --tekst: #efe6cf;
  --zacht: #b9ad8f;
  --goud: #d9b46a;
  --gevaar: #b8452f;
  --knop: #3a342a;
  --knop-hover: #4a4234;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--achter); color: var(--tekst); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
button { font: inherit; color: var(--tekst); background: var(--knop); border: 1px solid var(--rand); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--knop-hover); border-color: var(--goud); }
button:disabled { opacity: 0.45; cursor: default; }
button.hoofd { background: #6b5526; border-color: var(--goud); }
button.gevaar { background: var(--gevaar); border-color: #e07a5f; }
small { color: var(--zacht); }
.kleur { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.6); margin-right: 8px; vertical-align: -2px; flex: none; }

#kaart { position: fixed; inset: 48px 0 0 0; width: 100%; height: calc(100% - 48px); touch-action: none; cursor: grab; }
#kaart:active { cursor: grabbing; }

#balk { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: var(--balk); border-bottom: 1px solid var(--rand); display: flex; align-items: center; gap: 16px; padding: 0 12px; z-index: 5; }
#balk .wie { display: flex; align-items: center; min-width: 0; flex: 1 1 0; }
#balk .wie small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#balk .wie b { font-family: Georgia, serif; font-size: 16px; }
#balk .klok { display: flex; align-items: center; gap: 8px; }
#balk .speel { width: 36px; height: 32px; padding: 0; font-size: 15px; }
#balk .datum { min-width: 150px; text-align: center; line-height: 1.15; }
#balk .datum small { display: block; }
#balk .snelheden { display: flex; gap: 2px; }
#balk .snelheden button { padding: 3px 6px; font-size: 12px; min-width: 26px; }
#balk .snelheden button.aan { background: #6b5526; border-color: var(--goud); }
#balk .cijfers { display: flex; gap: 12px; white-space: nowrap; }
#balk .knoppen { display: flex; gap: 6px; }

#paneel { position: fixed; top: 60px; right: 12px; width: 290px; max-height: calc(100% - 72px); overflow: auto; background: var(--paneel); border: 1px solid var(--rand); border-radius: 6px; padding: 12px 14px; z-index: 4; }
#paneel h3 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 17px; display: flex; align-items: center; }
#paneel p { margin: 6px 0; }
#paneel h4 { margin: 12px 0 4px; font-family: Georgia, serif; font-size: 14px; color: var(--goud); font-weight: 600; }
.keuzes button.aan { background: #6b5526; border-color: var(--goud); }
.lijn { font-size: 13px; padding: 3px 0; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.06); }
.lijn:hover { color: var(--goud); }
button.bouw { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; margin-top: 5px; font-size: 13px; }
button.bouw > span:last-child { text-align: right; white-space: nowrap; }
.balkje { display: inline-block; width: 60px; height: 6px; background: #111; border-radius: 3px; overflow: hidden; vertical-align: 1px; }
.balkje i { display: block; height: 100%; }
.rood { color: #ff8a70; }
#paneel .klein, .klein { font-size: 12.5px; color: var(--zacht); }
#paneel a { color: var(--goud); }
#paneel table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0; }
#paneel td { padding: 2px 0; vertical-align: top; }
#paneel td:first-child { color: var(--zacht); width: 42%; }
.rij { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.leger { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 13px; }
.moraal { width: 60px; height: 6px; background: #111; border-radius: 3px; overflow: hidden; flex: none; }
.moraal i { display: block; height: 100%; background: #7bc96f; }

#berichten { position: fixed; left: 12px; bottom: 12px; width: min(420px, calc(100% - 24px)); display: flex; gap: 4px; z-index: 3; pointer-events: none; }
.bericht { background: var(--paneel); border: 1px solid var(--rand); border-left: 3px solid var(--zacht); border-radius: 4px; padding: 4px 8px; font-size: 12.5px; pointer-events: auto; cursor: pointer; }
.bericht.slag { border-left-color: var(--gevaar); }
.bericht.verovering { border-left-color: var(--goud); }
.bericht.gebeurtenis { border-left-color: #7aa6d6; }
.bericht:nth-child(n+4) { opacity: 0.7; }


#meldingen { position: fixed; top: 54px; left: 12px; right: 320px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 4; pointer-events: none; }
.melding-knop { pointer-events: auto; font-size: 12.5px; padding: 3px 9px; border-radius: 14px; background: var(--paneel); }
.melding-knop.rood { border-color: #e07a5f; color: #ffb4a0; }
.melding-knop.groen { border-color: #7bc96f; color: #b6e6ad; }
#kaartknoppen { position: fixed; right: 12px; bottom: 12px; z-index: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: calc(100% - 24px); }
#kaartknoppen .soorten { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; }
#kaartknoppen .soorten button { font-size: 12px; padding: 4px 8px; background: var(--paneel); }
#kaartknoppen .soorten button.aan { background: #6b5526; border-color: var(--goud); }
.legende { background: var(--paneel); border: 1px solid var(--rand); border-radius: 6px; padding: 6px 10px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 420px; }
.legende i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(0,0,0,0.5); }
#tip { position: fixed; z-index: 30; max-width: 300px; background: #14120e; color: var(--tekst); border: 1px solid var(--goud); border-radius: 5px; padding: 7px 9px; font-size: 12.5px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
#tip[hidden] { display: none; }
#tip table { border-collapse: collapse; margin-top: 4px; width: 100%; }
#tip td { padding: 1px 0; }
#tip p { margin: 4px 0 0; }
.r { text-align: right; padding-left: 10px; white-space: nowrap; }
tr.som td { border-top: 1px solid var(--rand); font-weight: 600; }
.gepauzeerd { color: #ff8a70; font-weight: 700; letter-spacing: 0.05em; }
#balk #spring { padding: 3px 8px; }
#balk #spring.aan { background: #6b5526; border-color: var(--goud); }
.venster-binnen { position: relative; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
.venster-binnen .inhoud { overflow: auto; }
.venster-binnen.breed { max-width: 860px; }
.venster-binnen .sluit { position: absolute; top: 10px; right: 10px; padding: 2px 8px; }
.twee { display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
.twee .lijst { max-height: 60vh; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.twee .detail { max-height: 60vh; overflow: auto; }
.twee table, .venster-binnen table { width: 100%; border-collapse: collapse; font-size: 13px; }
.twee td { padding: 2px 0; vertical-align: top; }
.twee td:first-child { color: var(--zacht); width: 40%; }
.twee h3 { margin: 0 0 4px; font-family: Georgia, serif; display: flex; align-items: center; }
.venster-binnen h4 { margin: 12px 0 4px; font-family: Georgia, serif; font-size: 14px; color: var(--goud); font-weight: 600; }
.lijn-knop { display: flex; align-items: center; gap: 4px; text-align: left; width: 100%; }
.lijn-knop.aan { background: #6b5526; border-color: var(--goud); }
.groei { flex: 1; }
.oordeel { border: 1px solid var(--rand); border-left: 3px solid var(--zacht); border-radius: 4px; padding: 6px 8px; margin: 6px 0; font-size: 12.5px; }
.oordeel.ja { border-left-color: #7bc96f; }
.oordeel.nee { border-left-color: #e07a5f; }
.oordeel td:first-child { color: var(--tekst) !important; width: auto !important; }
.groen { color: #9fd893; }
.tabel th { text-align: left; color: var(--zacht); font-weight: 500; padding: 3px 4px; border-bottom: 1px solid var(--rand); }
.tabel td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.tabel tr.ik td { color: var(--goud); }
.tabel tr.klik, .bericht.klik { cursor: pointer; }
.tabel tr.klik:hover td { color: var(--goud); }
.logboek { display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow: auto; }
.plaats { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.plaats .rij { margin: 0; }
label.knop { display: inline-block; font: inherit; background: var(--knop); border: 1px solid var(--rand); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
label.vink { display: block; margin: 5px 0; }
#zoekveld { width: 100%; font: inherit; padding: 8px; background: #1b1915; color: var(--tekst); border: 1px solid var(--rand); border-radius: 4px; margin-bottom: 8px; }
.tijd { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.tijd.nu b { color: var(--goud); }
.opties { padding-left: 18px; font-size: 13px; }
.tijdperken { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.tijdperken button { text-align: left; font-size: 13px; }
.tijdperken button.aan { background: #6b5526; border-color: var(--goud); }
.uitleg-tp { margin-top: 10px; max-width: 760px; }
.klein-knop { pointer-events: auto; font-size: 12px; padding: 2px 8px; align-self: flex-start; background: var(--paneel); }
#berichten { flex-direction: column; }

#melding { position: fixed; top: 60px; pointer-events: none; left: 50%; transform: translateX(-50%); background: #2b271f; border: 1px solid var(--goud); padding: 8px 14px; border-radius: 4px; z-index: 6; max-width: calc(100% - 32px); }

#venster { position: fixed; inset: 0; background: rgba(10,8,5,0.55); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
#venster[hidden], #start[hidden], #paneel[hidden], #melding[hidden] { display: none; }
.venster-binnen { background: #2b271f; border: 1px solid var(--goud); border-radius: 8px; padding: 20px 24px; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.venster-binnen h2 { margin: 0 0 8px; font-family: Georgia, serif; color: var(--goud); font-weight: 600; }
.venster-binnen ul { padding-left: 18px; }
.venster-binnen li { margin: 4px 0; }

#start { position: fixed; inset: 0; z-index: 20; overflow: auto; background: radial-gradient(ellipse at 30% 20%, #3a3123 0%, #1c1a16 70%); }
.start-binnen { max-width: 860px; margin: 0 auto; padding: 40px 16px 60px; }
#start h1 { font-family: Georgia, serif; font-size: 56px; margin: 0; color: var(--goud); letter-spacing: 0.06em; font-weight: 600; }
#start .onder { font-size: 16px; margin-top: 4px; }
#start h2 { font-family: Georgia, serif; font-weight: 600; font-size: 18px; margin: 22px 0 8px; color: var(--zacht); }
#start .kies { margin-top: 26px; font-size: 16px; }
.stammen { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.stam { display: flex; text-align: left; align-items: flex-start; padding: 10px 12px; background: rgba(58,52,42,0.75); }
.stam .kleur { margin-top: 3px; }
.stam .uitleg { font-size: 12.5px; color: var(--zacht); }
#start .noot { margin-top: 28px; font-size: 12px; color: var(--zacht); }
#verder { margin-top: 18px; padding: 10px 16px; font-size: 15px; }

@media (max-width: 760px) {
  #balk { gap: 8px; padding: 0 8px; }
  #balk .cijfers, #balk .wie small, #balk .wie b { display: none; }
  #balk .wie { flex: none; }
  #balk .breed { display: none; }
  #paneel { max-height: 55%; }
  #balk .klok { flex: 1; justify-content: center; }
  #balk .datum { min-width: 0; font-size: 12px; }
  #balk .snelheden button:nth-child(n+4) { display: none; }
  #paneel { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; max-height: 45%; }
  #berichten { display: none; }
  #meldingen { right: 12px; top: 52px; }
  #kaartknoppen { bottom: auto; top: 90px; }
  #kaartknoppen .legende { display: none; }
  .twee { grid-template-columns: 1fr; }
  .twee .lijst { max-height: 28vh; }
  #balk .knoppen #boverzicht { display: none; }
  #start h1 { font-size: 40px; }
}
</style>
</head>

<canvas id="kaart"></canvas>
<div id="meldingen"></div>
<div id="kaartknoppen"></div>
<aside id="paneel" hidden></aside>
<div id="berichten"></div>
<div id="melding" hidden></div>
<div id="venster" hidden></div>
<div id="start" hidden></div>
